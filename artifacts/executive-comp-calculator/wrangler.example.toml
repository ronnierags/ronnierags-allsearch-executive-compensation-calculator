# Copy to wrangler.toml after creating D1 and replace the database ID.
# Workers Builds must use artifacts/executive-comp-calculator as its root directory.
name = "ronnierags-allsearch-executive-compensation-calculator"
main = "./worker.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "allsearch-executive-compensation"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[assets]
directory = "./dist/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]