openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Compensation-plan lead capture
  - name: admin
    description: Protected lead administration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leads:
    post:
      operationId: createLead
      tags: [leads]
      summary: Capture a lead and prepare their compensation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReceipt"
        "400":
          description: Invalid lead
  /admin/leads:
    get:
      operationId: listLeads
      tags: [admin]
      summary: List captured leads for the authorized administrator
      responses:
        "200":
          description: Captured leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /admin/leads.csv:
    get:
      operationId: exportLeadsCsv
      tags: [admin]
      summary: Export captured leads as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema: { type: string }
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ScenarioInput:
      type: object
      additionalProperties: false
      properties:
        companyType: { type: string, enum: [Public, Private, PE-backed] }
        candidateRole: { type: string }
        year: { type: integer }
        yearsToModel: { type: integer, minimum: 1, maximum: 15 }
        marketReference: { type: number, minimum: 0 }
        baseSalary: { type: number, minimum: 0 }
        yearOneProRataPercent: { type: number, minimum: 0, maximum: 100 }
        annualIncreasePercent: { type: number, minimum: 0, maximum: 100 }
        targetIncentivePercent: { type: number, minimum: 0, maximum: 1000 }
        maximumMultiple: { type: number, minimum: 0 }
        annualEquityGrant: { type: number, minimum: 0 }
        equityVestingYears: { type: number, minimum: 1, maximum: 15 }
        equityValueFactorPercent: { type: number, minimum: 0 }
        minimumAnnualCashGuarantee: { type: number, minimum: 0 }
        guaranteeDurationMonths: { type: number, minimum: 0, maximum: 120 }
        severanceMonths: { type: number, minimum: 0, maximum: 60 }
        changeInControlMultiple: { type: number, minimum: 0 }
        baseIncrease: { type: number, minimum: 0 }
        proration: { type: number, minimum: 0, maximum: 1 }
        stiTarget: { type: number, minimum: 0 }
        stiMaximum: { type: number, minimum: 0 }
        guaranteedFloor: { type: number, minimum: 0 }
        floorFromYear: { type: integer, minimum: 1 }
        floorToYear: { type: integer, minimum: 1 }
        signOn: { type: number, minimum: 0 }
        signOnYear: { type: integer, minimum: 1 }
        relocation: { type: number, minimum: 0 }
        relocationYear: { type: integer, minimum: 1 }
        relocationGrossUp: { type: number, minimum: 0 }
        housingMonthly: { type: number, minimum: 0 }
        housingMonths: { type: number, minimum: 0 }
        housingYear: { type: integer, minimum: 1 }
        housingGrossUp: { type: number, minimum: 0 }
        retentionBonus: { type: number, minimum: 0 }
        retentionYear: { type: integer, minimum: 1 }
        rsuAnnualGrant: { type: number, minimum: 0 }
        rsuVestingYears: { type: number, minimum: 1 }
        psuAnnualTarget: { type: number, minimum: 0 }
        psuExpectedPayout: { type: number, minimum: 0 }
        psuVestingYears: { type: number, minimum: 1 }
        optionAnnualValue: { type: number, minimum: 0 }
        optionVestingYears: { type: number, minimum: 1 }
        equityStartYear: { type: integer, minimum: 1 }
        phantomPool: { type: number, minimum: 0 }
        phantomCoefficient: { type: number, minimum: 0 }
        evMultiple: { type: number, minimum: 0 }
        baselineEv: { type: number, minimum: 0 }
        phantomVestingYears: { type: number, minimum: 1 }
        phantomCliffYears: { type: number, minimum: 0 }
        valuationMethod: { type: string, enum: [ebitda, manual] }
        peOwnership: { type: number, minimum: 0 }
        peEntryValue: { type: number, minimum: 0 }
        peExitValue: { type: number, minimum: 0 }
        peExitYear: { type: integer, minimum: 1 }
        peHurdle: { type: number, minimum: 0 }
        peRatchetOwnership: { type: number, minimum: 0 }
        peRatchetHurdle: { type: number, minimum: 0 }
        severanceMultiple: { type: number, minimum: 0 }
        severanceIncludesBonus: { type: number, minimum: 0, maximum: 1 }
        severanceEquityAcceleration: { type: number, minimum: 0 }
        benefitsAnnual: { type: number, minimum: 0 }
        retirementAnnual: { type: number, minimum: 0 }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ScorecardMetric"
        yearlyCompensation:
          type: array
          items:
            $ref: "#/components/schemas/YearlyCompensation"
        revenue:
          type: array
          items: { type: number }
        ebitda:
          type: array
          items: { type: number }
        equityGrowth:
          type: array
          items: { type: number }
        manualEv:
          type: array
          items: { type: number }
        scores:
          type: array
          items:
            type: array
            items: { type: number }
      required: [companyType, candidateRole, year, yearsToModel, marketReference, baseSalary, yearOneProRataPercent, annualIncreasePercent, targetIncentivePercent, maximumMultiple, annualEquityGrant, equityVestingYears, equityValueFactorPercent, minimumAnnualCashGuarantee, guaranteeDurationMonths, severanceMonths, changeInControlMultiple, baseIncrease, proration, stiTarget, stiMaximum, guaranteedFloor, floorFromYear, floorToYear, signOn, signOnYear, relocation, relocationYear, relocationGrossUp, housingMonthly, housingMonths, housingYear, housingGrossUp, retentionBonus, retentionYear, rsuAnnualGrant, rsuVestingYears, psuAnnualTarget, psuExpectedPayout, psuVestingYears, optionAnnualValue, optionVestingYears, equityStartYear, phantomPool, phantomCoefficient, evMultiple, baselineEv, phantomVestingYears, phantomCliffYears, valuationMethod, peOwnership, peEntryValue, peExitValue, peExitYear, peHurdle, peRatchetOwnership, peRatchetHurdle, severanceMultiple, severanceIncludesBonus, severanceEquityAcceleration, benefitsAnnual, retirementAnnual, metrics, revenue, ebitda, equityGrowth, manualEv, scores, yearlyCompensation]
    ScorecardMetric:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        weight: { type: number }
        achievement: { type: number, minimum: 0, maximum: 200 }
      required: [name, weight, achievement]
    YearlyCompensation:
      type: object
      additionalProperties: false
      properties:
        year: { type: string }
        base: { type: number }
        incentive: { type: number }
        cash: { type: number }
        equity: { type: number }
        guaranteeTopUp: { type: number }
        totalComp: { type: number }
        revenue: { type: number }
        ebitda: { type: number }
        enterpriseValue: { type: number }
        evGrowth: { type: number }
        floor: { type: number }
        signOn: { type: number }
        relocation: { type: number }
        housing: { type: number }
        retention: { type: number }
        milestone: { type: number }
        rsu: { type: number }
        psu: { type: number }
        options: { type: number }
        phantom: { type: number }
        peExit: { type: number }
        benefits: { type: number }
        retirement: { type: number }
        longTerm: { type: number }
        severanceCash: { type: number }
        severanceEquity: { type: number }
        severanceTotal: { type: number }
      required: [year, base, incentive, cash, equity, guaranteeTopUp, totalComp, revenue, ebitda, enterpriseValue, evGrowth, floor, signOn, relocation, housing, retention, milestone, rsu, psu, options, phantom, peExit, benefits, retirement, longTerm, severanceCash, severanceEquity, severanceTotal]
    LeadInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        company: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, minLength: 1, maxLength: 200 }
        consent: { type: boolean, const: true }
        scenario:
          $ref: "#/components/schemas/ScenarioInput"
      required: [name, email, company, role, consent, scenario]
    LeadReceipt:
      type: object
      properties:
        id: { type: integer }
        pdfBase64: { type: string }
        fileName: { type: string }
        emailSent: { type: boolean }
      required: [id, pdfBase64, fileName, emailSent]
    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        company: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        scenario:
          $ref: "#/components/schemas/ScenarioInput"
      required: [id, name, email, company, role, createdAt, scenario]

